<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D0F" />
    <meta name="robots" content="noindex" />
    <title>404 — OutOf0</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="OutOf0, home">
        <img src="/brand/symbol-primary.svg" alt="" width="30" height="30" />
        <img src="/brand/wordmark-ink.svg" alt="OutOf0" width="108" height="30" />
      </a>

      <p class="eyebrow"><span></span> Error 404</p>
      <h1>Nothing<br /><em>here.</em></h1>
      <p class="lede">
        This page does not exist — or it moved. Everything OutOf0 ships is one of these:
      </p>

      <ul class="links">
        <li><a href="/">outof0.com<span aria-hidden="true">↗</span></a></li>
        <li><a href="https://kitland.dev" rel="noreferrer">kitland.dev<span aria-hidden="true">↗</span></a></li>
        <li><a href="https://anypick.dev" rel="noreferrer">anypick.dev<span aria-hidden="true">↗</span></a></li>
        <li><a href="https://gitview.dev" rel="noreferrer">gitview.dev<span aria-hidden="true">↗</span></a></li>
        <li><a href="https://github.com/outof0" rel="noreferrer">github.com/outof0<span aria-hidden="true">↗</span></a></li>
      </ul>

      <footer><span>Build · Ship · Create</span><span>From zero, forward.</span></footer>
    </main>

    <style>
      * { box-sizing: border-box; }
      html { background: #fff; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        color: #0b0d0f;
        background: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(560px, 100%); }
      a { color: inherit; text-decoration: none; }
      a:focus-visible { outline: 3px solid #39ff14; outline-offset: 4px; }
      .brand { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 46px; }
      .brand img:first-child { width: 30px; height: 30px; }
      .brand img:last-child { width: 112px; height: auto; transform: translateY(2px); }
      .eyebrow {
        display: flex; align-items: center; gap: 9px; margin: 0 0 22px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      }
      .eyebrow span { width: 8px; height: 8px; border-radius: 50%; background: #39ff14; }
      h1 {
        margin: 0 0 22px;
        font-family: "Arial Narrow", "Inter Tight", Inter, sans-serif;
        font-size: clamp(54px, 13vw, 84px);
        font-weight: 800; line-height: .88; letter-spacing: -.075em;
      }
      h1 em { font-family: Georgia, serif; font-weight: 400; letter-spacing: -.09em; }
      .lede { max-width: 400px; margin: 0 0 30px; color: #50555c; font-size: 16px; line-height: 1.55; }
      .links {
        display: grid; gap: 0; margin: 0 0 44px; padding: 0; list-style: none;
        border-top: 1px solid #0b0d0f;
      }
      .links a {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 14px 0; border-bottom: 1px solid #d9dcdf;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 13px; font-weight: 700;
        transition: padding .2s ease, color .2s ease;
      }
      .links a:hover { padding-left: 8px; color: #149c00; }
      .links span { color: #149c00; font-size: 16px; }
      footer {
        display: flex; justify-content: space-between; gap: 16px;
        padding-top: 16px; border-top: 1px solid #d9dcdf;
        color: #73787e;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      }
    </style>
  </body>
</html>
